<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>River landforms: floodplain, natural levees, cut bank, point bar, oxbow lake, delta, and alluvial fan</title>
  <rect width="1000" height="700" fill="#ffffff"/>

  <!-- ===================== MAP VIEW ===================== -->
  <text x="20" y="28" font-size="19" font-weight="700" fill="#1f2937">1. Bird's-eye view (looking down from above)</text>

  <!-- hills / valley walls -->
  <rect x="140" y="42" width="720" height="26" fill="#c8b48a"/>
  <rect x="140" y="402" width="720" height="26" fill="#c8b48a"/>
  <!-- floodplain -->
  <rect x="140" y="68" width="720" height="334" fill="#d9f0c4"/>
  <!-- sea -->
  <rect x="860" y="42" width="140" height="386" fill="#8ec5ee"/>
  <text x="930" y="400" font-size="15" font-weight="600" fill="#0b4f86" text-anchor="middle">Ocean</text>
  <text x="930" y="418" font-size="15" font-weight="600" fill="#0b4f86" text-anchor="middle">or lake</text>

  <!-- mountains -->
  <polygon points="0,428 0,42 140,42 140,428" fill="#a98b64"/>
  <polygon points="10,150 55,60 100,150" fill="#8a6d4a"/>
  <polygon points="50,250 100,160 140,250" fill="#8a6d4a"/>
  <polygon points="0,340 45,255 95,340" fill="#8a6d4a"/>
  <polygon points="60,428 105,345 140,428" fill="#8a6d4a"/>
  <text x="70" y="25" font-size="0">.</text>
  <text x="68" y="198" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Mountains</text>

  <!-- alluvial fan -->
  <path d="M140,350 Q200,330 262,352 Q282,388 262,402 L140,402 Z" fill="#e8c98f" stroke="#b8925a" stroke-width="2"/>
  <path d="M140,372 L250,360 M140,374 L262,380 M140,376 L240,398" stroke="#4a90d9" stroke-width="2.5" fill="none"/>
  <path d="M100,372 L140,374" stroke="#4a90d9" stroke-width="3" fill="none"/>

  <!-- oxbow lake (old, cut-off bend) -->
  <path d="M262,118 C262,70 352,70 352,118" stroke="#3b82f6" stroke-width="13" fill="none" stroke-linecap="round"/>

  <!-- natural levees along the last bend (darker banks) -->
  <path d="M650,170 C720,170 740,260 800,260 L860,260" stroke="#7c9a3c" stroke-width="32" fill="none"/>

  <!-- main river -->
  <path id="river" d="M140,250 C220,250 230,160 310,160 C390,160 400,330 480,330 C560,330 570,170 650,170 C720,170 740,260 800,260 L860,260"
        stroke="#3b82f6" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- point bar (inside of bend, sand) and cut bank (outside of bend) -->
  <path d="M428,280 Q480,326 532,280 Q480,294 428,280 Z" fill="#f2d48a" stroke="#c9a24c" stroke-width="2"/>
  <path d="M435,342 Q480,356 525,342" stroke="#6b4423" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- delta -->
  <path d="M858,240 Q905,195 950,225 Q975,262 950,298 Q905,328 858,282 Z" fill="#e8c98f" stroke="#b8925a" stroke-width="2"/>
  <path d="M860,260 L935,222 M860,260 L962,262 M860,260 L935,300" stroke="#3b82f6" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- flow arrows -->
  <path d="M185,232 l14,6 -14,6" stroke="#ffffff" stroke-width="3" fill="none"/>

  <!-- labels (map) -->
  <g font-size="15" fill="#1f2937">
    <!-- floodplain -->
    <text x="560" y="98" font-weight="700">Floodplain</text>
    <text x="560" y="116" font-size="13">(flat land that floods)</text>

    <!-- oxbow -->
    <line x1="352" y1="96" x2="395" y2="96" stroke="#1f2937" stroke-width="1.5"/>
    <text x="398" y="101" font-weight="700">Oxbow lake</text>

    <!-- point bar -->
    <line x1="480" y1="296" x2="480" y2="268" stroke="#1f2937" stroke-width="1.5"/>
    <text x="480" y="244" font-weight="700" text-anchor="middle">Point bar</text>
    <text x="480" y="261" font-size="13" text-anchor="middle">(sand on the inside)</text>

    <!-- cut bank -->
    <line x1="525" y1="345" x2="560" y2="372" stroke="#1f2937" stroke-width="1.5"/>
    <text x="563" y="378" font-weight="700">Cut bank</text>
    <text x="563" y="395" font-size="13">(worn away on the outside)</text>

    <!-- levees -->
    <line x1="745" y1="232" x2="720" y2="300" stroke="#1f2937" stroke-width="1.5"/>
    <text x="660" y="318" font-weight="700">Natural levees</text>
    <text x="660" y="335" font-size="13">(raised river banks)</text>

    <!-- delta -->
    <line x1="925" y1="232" x2="925" y2="168" stroke="#1f2937" stroke-width="1.5"/>
    <text x="898" y="162" font-weight="700">Delta</text>

    <!-- alluvial fan -->
    <line x1="230" y1="372" x2="300" y2="345" stroke="#1f2937" stroke-width="1.5"/>
    <text x="303" y="342" font-weight="700">Alluvial fan</text>

    <!-- river -->
    <text x="182" y="215" font-weight="700" fill="#1d4ed8">River</text>
  </g>

  <!-- ===================== SIDE VIEW ===================== -->
  <text x="20" y="470" font-size="19" font-weight="700" fill="#1f2937">2. Side view (slicing across the river)</text>

  <!-- flood level -->
  <line x1="110" y1="540" x2="890" y2="540" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="150" y="534" font-size="13" font-weight="600" fill="#1d4ed8">Flood water level</text>

  <!-- ground -->
  <path d="M40,488 L110,560 L370,560 Q410,548 425,548 Q440,548 452,556 L462,640 Q510,648 560,640 L640,566 Q660,548 680,548 Q700,548 720,560 L890,560 L960,488 L960,690 L40,690 Z"
        fill="#b9895a"/>
  <!-- floodplain soil (top layer) -->
  <path d="M110,560 L370,560 L370,570 L110,570 Z M720,560 L890,560 L890,570 L720,570 Z" fill="#7aa64a"/>
  <!-- levees highlight -->
  <path d="M370,560 Q410,548 425,548 Q440,548 452,556 L452,566 L370,566 Z" fill="#7c9a3c"/>
  <path d="M640,566 Q660,548 680,548 Q700,548 720,560 L720,566 Z" fill="#7c9a3c"/>
  <!-- point bar sand -->
  <path d="M560,640 L640,566 L652,572 L585,644 Z" fill="#f2d48a"/>
  <!-- water -->
  <path d="M453,566 L462,640 Q510,648 560,640 L634,572 Z" fill="#3b82f6" opacity="0.85"/>

  <!-- labels (side view) -->
  <g font-size="15" fill="#1f2937">
    <text x="55" y="672" font-weight="700" fill="#ffffff">Valley wall</text>
    <text x="190" y="598" font-weight="700" fill="#ffffff">Floodplain</text>
    <text x="760" y="598" font-weight="700" fill="#ffffff">Floodplain</text>

    <line x1="415" y1="546" x2="395" y2="505" stroke="#1f2937" stroke-width="1.5"/>
    <text x="320" y="500" font-weight="700">Natural levee</text>
    <line x1="682" y1="546" x2="700" y2="505" stroke="#1f2937" stroke-width="1.5"/>
    <text x="650" y="500" font-weight="700">Natural levee</text>

    <line x1="456" y1="600" x2="395" y2="625" stroke="#1f2937" stroke-width="1.5"/>
    <text x="298" y="632" font-weight="700">Cut bank</text>
    <text x="246" y="650" font-size="13">(steep, fast water digs here)</text>

    <line x1="612" y1="610" x2="680" y2="625" stroke="#1f2937" stroke-width="1.5"/>
    <text x="684" y="632" font-weight="700">Point bar</text>
    <text x="684" y="650" font-size="13">(gentle, slow water drops sand)</text>

    <text x="508" y="612" font-weight="700" fill="#ffffff" text-anchor="middle">River</text>
  </g>
</svg>
